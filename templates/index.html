<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Verified Agent</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 20px auto; padding: 0 12px; }
  #log { border: 1px solid #ccc; height: 280px; overflow-y: auto; padding: 8px; white-space: pre-wrap; }
  .user { color: #0645ad; } .ai { color: #222; } .tool { color: #666; }
  .info, .error { color: #b00; } .system { color: #999; }
  #f { display: flex; gap: 6px; margin: 8px 0 20px; }
  #in { flex: 1; padding: 6px; }
  .card { border: 2px solid #e0a800; padding: 8px; margin-bottom: 10px; }
  .card textarea { width: 100%; box-sizing: border-box; height: 80px; display: block; margin: 6px 0; }
  .card button { margin-right: 6px; }
</style>
</head>
<body>
<h3>Chat</h3>
<div id="log"></div>
<form id="f"><input id="in" autocomplete="off" placeholder="Message the agent"><button>Send</button></form>

<h3>Waiting for your verification</h3>
<div id="pending"></div>

<script>
const sid = crypto.randomUUID();
const proto = location.protocol === "https:" ? "wss://" : "ws://";
const chat = new WebSocket(`${proto}${location.host}/ws/chat?sid=${sid}`);
const ver  = new WebSocket(`${proto}${location.host}/ws/verify?sid=${sid}`);
const log = document.getElementById("log");
const pending = document.getElementById("pending");
const input = document.getElementById("in");

function addLog(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = `${cls}: ${text}`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

document.getElementById("f").onsubmit = (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || chat.readyState !== 1) return;
  addLog("user", t);
  chat.send(JSON.stringify({ type: "user_message", content: t }));
  input.value = "";
};

// committed (already verified) messages coming from the agent
chat.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === "done") return addLog("system", "-- done --");
  if (m.type === "info" || m.type === "error") return addLog(m.type, m.content);
  let text = m.content;
  if (m.tool_calls && m.tool_calls.length) text += `\n[tool calls: ${JSON.stringify(m.tool_calls)}]`;
  addLog(m.role, text);
};

// proposals from the reducer that need approve / edit / reject
ver.onmessage = (e) => {
  const p = JSON.parse(e.data);
  if (p.type !== "proposal") return;

  const div = document.createElement("div");
  div.className = "card";
  const title = document.createElement("b");
  title.textContent = p.role + (p.name ? ` (${p.name})` : "");
  const content = document.createElement("textarea");
  content.value = p.content;
  div.append(title, content);

  let calls = null;
  if (p.tool_calls && p.tool_calls.length) {
    calls = document.createElement("textarea");
    calls.value = JSON.stringify(p.tool_calls, null, 2);
    div.append("tool calls (JSON, keep the ids):", calls);
  }

  const answer = (type) => {
    const out = { type, id: p.id };
    if (type === "edit") {
      out.content = content.value;
      if (calls) {
        try { out.tool_calls = JSON.parse(calls.value); }
        catch { alert("Tool calls JSON is invalid"); return; }
      }
    }
    ver.send(JSON.stringify(out));
    div.remove();
  };

  for (const [label, type] of [["Approve", "approve"], ["Edit & send", "edit"], ["Reject", "reject"]]) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => answer(type);
    div.append(b);
  }
  pending.appendChild(div);
};
</script>
</body>
</html>
